name: Deploy Sifter MK2 preview

on:
  push:
    branches:
      - test/adaptive-questionnaire-page
    paths:
      - "src/**"
      - "wrangler.sifter-preview.json"
      - ".github/workflows/deploy-sifter-preview.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy isolated Sifter MK2 preview
        run: npx --yes wrangler@4 deploy --config wrangler.sifter-preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
